[project]
name = "econometrics-hw-3"
version = "0.1.0"
description = "Financial Econometrics Homework 3: Fama-French 3-Factor Model estimation"
readme = "README.md"
authors = [
    { name = "Dobri", email = "79987000+NehuaV@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.8.0",
]

[project.scripts]
econometrics-hw-3 = "main_analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main_analysis.py"]
